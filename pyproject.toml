[project]
name = "leenef"
version = "0.1.0"
description = "Machine learning with the Neural Engineering Framework (Eliasmith & Anderson)"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Nikša Bosnić", email = "nikeke@otpisani.net"},
]
keywords = ["neural-engineering-framework", "least-squares", "random-features", "continual-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/nikeke/leenef"
Documentation = "https://github.com/nikeke/leenef/tree/main/docs"

[project.scripts]
leenef-install-skill = "leenef.install_skill:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
bench = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torchaudio>=2.0,<2.11",
]
docs = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
leenef = [
    "py.typed",
    "skill_assets/**/*",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
